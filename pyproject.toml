[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "viral-stitch-godmode"
version = "1.2.0"
description = "Viral Stitch's proprietary editorial system running on GPT-5.6 with deterministic beat-synced rendering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ILLCO"}]
dependencies = ["numpy>=1.26"]

[project.scripts]
viral-stitch = "viral_stitch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/viral_stitch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
